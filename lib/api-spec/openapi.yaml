openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Iran Epidemiology Data Repository API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: datasets
    description: Dataset operations
  - name: categories
    description: Category operations
  - name: variables
    description: Variable dictionary operations
  - name: stats
    description: Repository statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /datasets:
    get:
      operationId: listDatasets
      tags: [datasets]
      summary: List all datasets
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by title or description
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
          description: Filter by category ID
        - name: featured
          in: query
          schema:
            type: ["boolean", "null"]
          description: Filter featured datasets
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: List of datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetListResponse"
    post:
      operationId: createDataset
      tags: [datasets]
      summary: Create a new dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"

  /datasets/featured:
    get:
      operationId: getFeaturedDatasets
      tags: [datasets]
      summary: Get featured datasets
      responses:
        "200":
          description: Featured datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dataset"

  /datasets/{id}:
    get:
      operationId: getDataset
      tags: [datasets]
      summary: Get a single dataset with its variables
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dataset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetail"
        "404":
          description: Not found
    put:
      operationId: updateDataset
      tags: [datasets]
      summary: Update a dataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetUpdate"
      responses:
        "200":
          description: Updated dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          description: Not found
    delete:
      operationId: deleteDataset
      tags: [datasets]
      summary: Delete a dataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a new category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /variables:
    get:
      operationId: listAllVariables
      tags: [variables]
      summary: List all variables across all datasets (admin use)
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search by name, label, or description
        - name: datasetId
          in: query
          schema:
            type: ["integer", "null"]
          description: Filter by dataset ID
        - name: type
          in: query
          schema:
            type: ["string", "null"]
          description: Filter by variable type
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of variables
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VariableListResponse"

  /datasets/{datasetId}/variables:
    get:
      operationId: listVariables
      tags: [variables]
      summary: List variables for a dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
    post:
      operationId: createVariable
      tags: [variables]
      summary: Add a variable to a dataset
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"

  /datasets/{datasetId}/variables/{id}:
    put:
      operationId: updateVariable
      tags: [variables]
      summary: Update a variable
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
    delete:
      operationId: deleteVariable
      tags: [variables]
      summary: Delete a variable
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get repository statistics
      responses:
        "200":
          description: Repository statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      required: [id, name, nameFa, slug, datasetCount]
      properties:
        id:
          type: integer
        name:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        descriptionFa:
          type: ["string", "null"]
        datasetCount:
          type: integer

    CategoryInput:
      type: object
      required: [name, nameFa, slug]
      properties:
        name:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        description:
          type: string
        descriptionFa:
          type: string

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
        nameFa:
          type: string
        slug:
          type: string
        description:
          type: string
        descriptionFa:
          type: string

    Dataset:
      type: object
      required: [id, title, titleFa, description, descriptionFa, recordsCount, variablesCount, yearStart, yearEnd, geographicCoverage, dataSource, isFeatured, createdAt, categoryId]
      properties:
        id:
          type: integer
        title:
          type: string
        titleFa:
          type: string
        description:
          type: string
        descriptionFa:
          type: string
        recordsCount:
          type: integer
        variablesCount:
          type: integer
        yearStart:
          type: integer
        yearEnd:
          type: integer
        geographicCoverage:
          type: string
        geographicCoverageFa:
          type: string
        dataSource:
          type: string
        dataSourceFa:
          type: string
        citationText:
          type: ["string", "null"]
        citationDoi:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        categoryNameFa:
          type: ["string", "null"]
        createdAt:
          type: string

    DatasetDetail:
      type: object
      required: [id, title, titleFa, description, descriptionFa, recordsCount, variablesCount, yearStart, yearEnd, geographicCoverage, dataSource, isFeatured, createdAt, categoryId, variables]
      properties:
        id:
          type: integer
        title:
          type: string
        titleFa:
          type: string
        description:
          type: string
        descriptionFa:
          type: string
        recordsCount:
          type: integer
        variablesCount:
          type: integer
        yearStart:
          type: integer
        yearEnd:
          type: integer
        geographicCoverage:
          type: string
        geographicCoverageFa:
          type: string
        dataSource:
          type: string
        dataSourceFa:
          type: string
        citationText:
          type: ["string", "null"]
        citationDoi:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        categoryNameFa:
          type: ["string", "null"]
        createdAt:
          type: string
        variables:
          type: array
          items:
            $ref: "#/components/schemas/Variable"

    DatasetInput:
      type: object
      required: [title, titleFa, description, descriptionFa, recordsCount, variablesCount, yearStart, yearEnd, geographicCoverage, dataSource, categoryId]
      properties:
        title:
          type: string
        titleFa:
          type: string
        description:
          type: string
        descriptionFa:
          type: string
        recordsCount:
          type: integer
        variablesCount:
          type: integer
        yearStart:
          type: integer
        yearEnd:
          type: integer
        geographicCoverage:
          type: string
        geographicCoverageFa:
          type: string
        dataSource:
          type: string
        dataSourceFa:
          type: string
        citationText:
          type: string
        citationDoi:
          type: string
        isFeatured:
          type: boolean
        categoryId:
          type: integer

    DatasetUpdate:
      type: object
      properties:
        title:
          type: string
        titleFa:
          type: string
        description:
          type: string
        descriptionFa:
          type: string
        recordsCount:
          type: integer
        variablesCount:
          type: integer
        yearStart:
          type: integer
        yearEnd:
          type: integer
        geographicCoverage:
          type: string
        geographicCoverageFa:
          type: string
        dataSource:
          type: string
        dataSourceFa:
          type: string
        citationText:
          type: string
        citationDoi:
          type: string
        isFeatured:
          type: boolean
        categoryId:
          type: integer

    DatasetListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Variable:
      type: object
      required: [id, datasetId, name, nameFa, label, labelFa, type, description, descriptionFa]
      properties:
        id:
          type: integer
        datasetId:
          type: integer
        datasetTitle:
          type: ["string", "null"]
        datasetTitleFa:
          type: ["string", "null"]
        name:
          type: string
        nameFa:
          type: string
        label:
          type: string
        labelFa:
          type: string
        type:
          type: string
          enum: [numeric, categorical, date, text]
        description:
          type: string
        descriptionFa:
          type: string
        valuesRange:
          type: ["string", "null"]
        valuesRangeFa:
          type: ["string", "null"]
        missingValueNotes:
          type: ["string", "null"]
        missingValueNotesFa:
          type: ["string", "null"]

    VariableInput:
      type: object
      required: [name, nameFa, label, labelFa, type, description, descriptionFa]
      properties:
        name:
          type: string
        nameFa:
          type: string
        label:
          type: string
        labelFa:
          type: string
        type:
          type: string
          enum: [numeric, categorical, date, text]
        description:
          type: string
        descriptionFa:
          type: string
        valuesRange:
          type: string
        valuesRangeFa:
          type: string
        missingValueNotes:
          type: string
        missingValueNotesFa:
          type: string

    VariableUpdate:
      type: object
      properties:
        name:
          type: string
        nameFa:
          type: string
        label:
          type: string
        labelFa:
          type: string
        type:
          type: string
          enum: [numeric, categorical, date, text]
        description:
          type: string
        descriptionFa:
          type: string
        valuesRange:
          type: string
        valuesRangeFa:
          type: string
        missingValueNotes:
          type: string
        missingValueNotesFa:
          type: string

    VariableListResponse:
      type: object
      required: [data, total, page, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Variable"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    RepoStats:
      type: object
      required: [totalDatasets, totalVariables, totalRecords, categoriesCount, yearRange]
      properties:
        totalDatasets:
          type: integer
        totalVariables:
          type: integer
        totalRecords:
          type: integer
        categoriesCount:
          type: integer
        yearRange:
          type: string
        recentDatasets:
          type: array
          items:
            $ref: "#/components/schemas/Dataset"
