name: Deploy RegistryHub support test API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registryhub-support-test-only
  cancel-in-progress: false

jobs:
  deploy-test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/registryhub-catalogue-support
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create isolated test Worker config
        shell: bash
        run: |
          cat > workers/registryhub-support-api/wrangler.test.jsonc <<'EOF'
          {
            "name": "registryhub-support-test",
            "main": "src/index.mjs",
            "compatibility_date": "2026-10-27",
            "workers_dev": true,
            "triggers": { "crons": ["17 3 * * *"] },
            "vars": {
              "PUBLIC_ORIGIN": "https://registryhub-support-playground.erfan8km.workers.dev",
              "CATALOG_URL": "https://registryhub.erfan8km.workers.dev/data/registries.json",
              "PER_IP_MINUTE_LIMIT": "10",
              "PER_IP_DAILY_MESSAGE_LIMIT": "10",
              "DAILY_MESSAGE_LIMIT": "50"
            },
            "ai": { "binding": "AI" },
            "services": [{ "binding": "CATALOG_SERVICE", "service": "registryhub" }],
            "d1_databases": [{
              "binding": "DB",
              "database_name": "registryhub-support-test",
              "database_id": "cb051d20-ce4a-438c-a731-75e903ffbfb5",
              "migrations_dir": "migrations"
            }]
          }
          EOF
      - name: Deploy only the isolated test Worker
        run: npx --yes wrangler@4 deploy --config workers/registryhub-support-api/wrangler.test.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify test Worker health and origin restrictions
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://registryhub-support-test.erfan8km.workers.dev/health
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X OPTIONS \
            -H 'Origin: https://registryhub-support-playground.erfan8km.workers.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' \
            https://registryhub-support-test.erfan8km.workers.dev/api/chat)
          test "$status" = "204"
