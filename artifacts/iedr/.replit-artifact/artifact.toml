kind = "web"
previewPath = "/"
title = "RegistryHub"
version = "1.0.0"
id = "artifacts/iedr"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 19420

[services.development]
run = "pnpm --filter @workspace/iedr run dev"

[services.production]
build = ["pnpm", "run", "build"]
publicDir = "dist"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19420"
